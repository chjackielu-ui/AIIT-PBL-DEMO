server.address=${PBL_BIND_ADDRESS:127.0.0.1}
server.port=8080
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB
server.servlet.session.cookie.same-site=strict
server.error.include-message=always
app.data-dir=${PBL_FILES_DIR:D:/PBLDemoStorage}
app.storage=${PBL_STORAGE:mysql}
app.mysql.url=${PBL_DB_URL:jdbc:mysql://127.0.0.1:3306/pbl_demo?connectTimeout=5000&socketTimeout=10000}
app.mysql.user=${PBL_DB_USER:root}
app.mysql.password=${PBL_DB_PASSWORD:}
app.bootstrap.password=${PBL_ADMIN_PASSWORD:}
app.bootstrap.demo-accounts=${PBL_DEMO_ACCOUNTS:false}
app.office.executable=${PBL_OFFICE_EXECUTABLE:}
